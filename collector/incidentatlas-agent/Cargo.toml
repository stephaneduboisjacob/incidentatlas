[package]
name = "incidentatlas-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Privacy-first Linux operational change collector for IncidentAtlas"

[[bin]]
name = "incidentatlas-agent"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.189"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.18"
toml = "=1.1.6"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
