server {
    listen 80;
    listen [::]:80;
    server_name incidentatlas.btcpay.exchange;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/incidentatlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://incidentatlas.btcpay.exchange$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name incidentatlas.btcpay.exchange;

    ssl_certificate /etc/letsencrypt/live/incidentatlas.btcpay.exchange/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incidentatlas.btcpay.exchange/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IncidentAtlasTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
