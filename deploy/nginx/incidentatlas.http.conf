# Temporary bootstrap vhost for ACME HTTP-01 validation. Replace this file
# with incidentatlas.example.com after the certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name incidentatlas.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/incidentatlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
