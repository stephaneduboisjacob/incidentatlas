name: incidentatlas

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentatlas
      POSTGRES_USER: incidentatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentatlas -d incidentatlas"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: ["sh", "-ec", "node apps/api/dist/migrate.js && exec node apps/api/dist/server.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://incidentatlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/incidentatlas
      INCIDENTATLAS_SETUP_TOKEN: ${INCIDENTATLAS_SETUP_TOKEN:?Set INCIDENTATLAS_SETUP_TOKEN in .env}
      INCIDENTATLAS_ENROLLMENT_TOKEN: ${INCIDENTATLAS_ENROLLMENT_TOKEN:?Set INCIDENTATLAS_ENROLLMENT_TOKEN in .env}
      INCIDENTATLAS_SESSION_SECRET: ${INCIDENTATLAS_SESSION_SECRET:?Set INCIDENTATLAS_SESSION_SECRET in .env}
      INCIDENTATLAS_PUBLIC_ORIGIN: ${INCIDENTATLAS_PUBLIC_ORIGIN:-https://incidentatlas.btcpay.exchange}
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - artifacts:/var/lib/incidentatlas/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/worker/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://incidentatlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/incidentatlas
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m

volumes:
  postgres_data:
  artifacts:
